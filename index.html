<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice</title>
    <link rel="stylesheet" href="style.css">
    <!-- Vi kobler til CSS-filen. Den gir stil til siden. -->
</head>

<body>
    <main>
        <h1>Liars Dice</h1>

         <!-- Dette skjemaet lar oss velge hvor mange terninger vi bruker. -->
        <form id="settings">
            <fieldset>
                <div class="field">
                    <!-- Vi spør brukeren å velge antall terninger. -->
                    <label for="diceCount"> Choose dice count</label>
                    <!-- Her velger brukeren et tall. -->
                    <select id="diceCount" name="diceCount" required>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select>

                </div>
                
            </fieldset>
            <button type="button" id="rollButton">Roll Dice!</button> <!-- Knapp for å kaste terningene. -->
        </form>
        <section id="results" hidden><!-- Her viser vi resultatene etter at vi har kastet terningene. -->

            <div id="diceContainer"></div> <!-- Her plasserer vi alle terningene. -->
            <p id="totalSum"></p> <!-- Her viser vi summen av terningene. -->
        
        </section>
    </main>
    <script src="script.js" defer></script>  <!-- Vi kobler til JavaScript-filen. Den gjør siden interaktiv. -->
</body>

</html>
